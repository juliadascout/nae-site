# The site was a plain static deployment until checkout needed somewhere to
# price an order that a buyer cannot reach. It is still a static deployment:
# the Worker answers /api/ and hands everything else to the assets, which are
# the same committed files as before.
name = "nae-site"
main = "worker/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
# The site generates its own 404 page; serve it rather than a bare Worker error.
not_found_handling = "404-page"
# Without this the Worker never runs for /api/. With not_found_handling set,
# the asset router answers anything that does not match a file - so every
# checkout call got the 404 page as HTML instead of JSON, the PayPal popup
# opened and died instantly, and the only symptom was a generic apology.
# Assets still win for everything else, so pages keep being served straight
# from the asset store without waking the Worker.
run_worker_first = [ "/api/*" ]

[vars]
PAYPAL_ENV = "sandbox"
# Public by design - it is embedded in any page that shows a PayPal button.
# The "Default Application" sandbox app. The newer "NAE site checkout" app was
# tried first and its id has an unusual shape; this one is the classic REST
# format and is the pair the stored secret belongs to.
PAYPAL_CLIENT_ID = "AWEFDASCNFR7T-Hhsp1v2_t3Sn507X4xNGKO9wkr7SmNW9m5-Vx3-iu1h5OCj5A6uxF1ysoNCPkWDjQ7"
# Price list, HST and the refund policy were all settled on 18 Sept, so the
# buttons are on. PAYPAL_ENV is still sandbox: this takes test cards, not money.
# The endpoints refuse with 503 while this is false.
CHECKOUT_ENABLED = "true"

# PAYPAL_CLIENT_SECRET is NOT here and never will be. It is set with:
#   npx wrangler secret put PAYPAL_CLIENT_SECRET
