# The site was a plain static deployment until checkout needed somewhere to
# price an order that a buyer cannot reach. It is still a static deployment:
# the Worker answers /api/ and hands everything else to the assets, which are
# the same committed files as before.
name = "nae-site"
main = "worker/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
# The site generates its own 404 page; serve it rather than a bare Worker error.
not_found_handling = "404-page"
# Without this the Worker never runs for /api/. With not_found_handling set,
# the asset router answers anything that does not match a file - so every
# checkout call got the 404 page as HTML instead of JSON, the payment popup
# opened and died instantly, and the only symptom was a generic apology.
# Assets still win for everything else, so pages keep being served straight
# from the asset store without waking the Worker.
run_worker_first = [ "/api/*" ]

[vars]
# Online payment is Stripe Checkout (worker/stripe.js), from 29 Oct 2026.
# The buttons stay hidden until every piece below is in place, so this can be
# deployed before Stripe is set up; /api/checkout/health says what is missing.
CHECKOUT_ENABLED = "true"

# HST: one fixed tax rate, created once in the Stripe Dashboard (Product
# catalogue > Tax rates > New: "HST", 13%, exclusive, Canada / Ontario), and
# its id pasted here. Not Stripe Tax: that charges a fee on every sale to work
# out a rate that is always 13% here. Test mode and live mode each have their
# own id; change this one when switching to live. Empty = checkout stays shut.
STRIPE_HST_RATE = ""

# STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are NOT here and never will be.
# They are Worker secrets, set with:
#   npx wrangler secret put STRIPE_SECRET_KEY        (sk_test_... or sk_live_...)
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET    (whsec_... from the endpoint)
# The webhook endpoint is https://beautycourse.ca/api/stripe/webhook, sending:
#   checkout.session.completed, checkout.session.async_payment_succeeded,
#   checkout.session.async_payment_failed, charge.refunded,
#   charge.dispute.created, charge.dispute.closed
# The old PAYPAL_CLIENT_SECRET can be deleted: npx wrangler secret delete PAYPAL_CLIENT_SECRET

# Accounts: the same ones the apps use, kept by the nae-inc Worker. This is a
# service binding - a direct call to that Worker inside Cloudflare, not a
# request across the internet, so Cloudflare Access is not in the way - and it
# only reaches the endpoints worker/index.js passes on (ACCOUNT_PATHS). It is
# not the accounts database: this Worker still cannot read a password hash.
[[services]]
binding = "ACCOUNTS"
service = "nae-inc"

# Email. This Worker sends none itself. A student's enrolment confirmation,
# and the administrators' alerts for a new enrolment or a question from the
# Contact page, are sent by the apps' Worker, which sends every account email
# already and knows who the administrators are (nae-inc worker/notify.js).
# This reaches only its Notify entrypoint - two methods, enrolment and
# enquiry - and nothing in the apps.
[[services]]
binding = "NOTIFY"
service = "nae-inc"
entrypoint = "Notify"

# Who bought what. Separate from the accounts database on purpose: this Worker
# is the public site, and it has no business being able to read a password
# hash. Personal data lives here and never in the data repository.
[[d1_databases]]
binding = "ENROLMENTS"
database_name = "nae-enrolments"
database_id = "64edfe1d-48b5-401a-940d-2af5ff865748"

# Workers Logs: what the Worker writes with console.error - a payment that
# could not be recorded, an email that did not go - plus one line per request
# to /api/ (address, status, timing; no bodies), kept 7 days in the dashboard
# under Workers & Pages > nae-site > Observability. Pages are served without
# waking the Worker, so they are not in it. Nothing logs a name, an address or
# a message. Stated here so a deploy cannot quietly turn it off.
[observability]
enabled = true

  [observability.logs]
  enabled = true
  invocation_logs = true
  head_sampling_rate = 1

  [observability.traces]
  enabled = false
